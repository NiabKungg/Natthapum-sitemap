  <rect width="1200" height="1620" fill="#F6FAF8"/>

  <!-- ===== header ===== -->
  <text x="70" y="54" class="h1">โครงข่ายการเชื่อมโยงหน้าเว็บ (Site Link Map)</text>
  <text x="70" y="82" class="h2">ภาพรวมว่าแต่ละหน้ากดไปต่อหน้าใดได้บ้าง — ประกอบเอกสาร Sitemap v1.0 · 24 ก.ย. 2026</text>

  <!-- legend -->
  <rect x="70" y="101" width="14" height="14" rx="4" fill="#2F8C7E"/><text x="92" y="113" class="lg">ฝั่งผู้ซื้อ</text>
  <rect x="185" y="101" width="14" height="14" rx="4" fill="#7A6AE0"/><text x="207" y="113" class="lg">ฝั่งแอดมิน</text>
  <rect x="300" y="101" width="14" height="14" rx="4" fill="#06C755"/><text x="322" y="113" class="lg">จุดเข้าจาก LINE OA</text>
  <line x1="452" y1="108" x2="478" y2="108" stroke="#D98E2B" stroke-width="2.2" stroke-dasharray="6 5"/><text x="486" y="113" class="lg">ทางสำรอง: แอดมินอนุมัติมือ</text>
  <text x="1160" y="113" text-anchor="end" class="znote">เลขในวงกลม = ลำดับใน User Flow (1–8)</text>

  <!-- ===== USER ZONE ===== -->
  <rect x="40" y="150" width="1120" height="1120" rx="24" fill="#FFFFFF" stroke="#DCE8E4"/>
  <text x="70" y="186" class="zn" fill="#2F8C7E">ฝั่งผู้ซื้อ (FRONT)</text>

  <!-- edges (under nodes) -->
  <path class="edge" marker-end="url(#arr)" d="M600 266 L600 338"/>
  <path class="edge" marker-end="url(#arr)" d="M600 406 L600 478"/>
  <path class="edge" marker-end="url(#arr)" d="M600 546 L600 618"/>
  <path class="edge" marker-end="url(#arr)" d="M600 686 L600 758"/>
  <path class="edge" marker-end="url(#arr)" d="M600 826 L600 898"/>
  <path class="edge" marker-end="url(#arr)" d="M600 966 L600 1038"/>
  <path class="edge" marker-end="url(#arr)" d="M600 1106 L600 1178"/>
  <path class="edge" marker-end="url(#arr)" d="M485 368 C 390 338, 170 376, 170 476"/>
  <path class="edge" marker-end="url(#arr)" d="M170 546 C 170 800, 320 935, 478 935"/>
  <path class="edge" marker-end="url(#arr)" d="M716 935 L816 935"/>

  <text x="614" y="450" class="lbl">กดเลือกแพ็กเกจ</text>
  <text x="614" y="590" class="lbl">ยืนยันออเดอร์</text>
  <text x="614" y="730" class="lbl">อัปโหลดสลิป</text>
