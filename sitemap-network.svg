    <circle cx="31" cy="31" r="17" fill="#E3F8EB"/>
    <use href="#ic-chat" x="22" y="22" width="18" height="18" style="color:#08A24B"/>
    <text x="58" y="27" class="nt">LINE OA</text>
    <text x="58" y="46" class="nd">บรอดแคสต์ · ริชเมนู</text>
    <circle cx="222" cy="5" r="12" fill="#06C755"/><text x="222" y="9.5" text-anchor="middle" class="bdg">1</text>
  </g>

  <!-- node: landing (2) -->
  <g transform="translate(425,344)">
