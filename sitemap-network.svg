    <text x="58" y="27" class="nt">ประวัติการซื้อ</text>
    <text x="58" y="46" class="nd">ออเดอร์ · สลิปที่อัปโหลด</text>
  </g>

  <!-- ===== ADMIN ZONE ===== -->
